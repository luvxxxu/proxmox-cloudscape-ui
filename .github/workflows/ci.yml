name: Validate
on:
  push:
  pull_request:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun audit
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: bash scripts/check-bootstrap.sh
      - run: bash scripts/check-deployment.sh
      - run: bun run build
      - run: docker build -t proxmox-cloudscape-ui:test .
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:smoke
        env:
          SMOKE_IMAGE: proxmox-cloudscape-ui:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          overwrite: true
          path: test-results/
          if-no-files-found: ignore
      - name: Package tested Linux runtime
        if: github.event_name == 'push'
        run: bash scripts/package-runtime.sh proxmox-cloudscape-ui:test
      - name: Verify pull deployment and rollback
        if: github.event_name == 'push'
        run: bash scripts/check-pull-deployment.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: runtime-linux-x64-${{ github.sha }}
          overwrite: true
          path: build/runtime.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
  lxc-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        debian: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun run package:source
      - run: bash scripts/check-lxc-install.sh
        env:
          LXC_TEST_DEBIAN_VERSION: ${{ matrix.debian }}
