# Place in /etc/nginx/sites-available/proxmox-cloudscape.
# Replace proxmox-ui.example.com and TLS certificate paths before enabling.
# These maps/zones belong in nginx's http context (Debian sites-enabled does).
map $http_upgrade $proxmox_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=proxmox_login:10m rate=10r/m;

server {
    listen 80;
    server_name proxmox-ui.example.com;
    return 301 https://proxmox-ui.example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name proxmox-ui.example.com;
    ssl_certificate /etc/ssl/proxmox-cloudscape/fullchain.pem;
    ssl_certificate_key /etc/ssl/proxmox-cloudscape/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Match your largest approved ISO/template size. Streaming avoids disk buffering.
    client_max_body_size 64g;
    client_body_timeout 120s;

    location ~ ^/api/auth/(login|openid)$ {
        # Authentication only accepts small JSON bodies. Do not buffer ISO-sized
        # anonymous requests on disk before the application can reject them.
        client_max_body_size 16k;
        client_body_timeout 15s;
        limit_req zone=proxmox_login burst=20 nodelay;
        limit_req_status 429;
        # OIDC callback carries a code in the query; do not log it.
        access_log off;
        # Nginx error messages can also include a request URI containing credentials.
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }

    location /ws {
        # Console tickets are query parameters; never store them in access logs.
        access_log off;
        # Nginx error messages can also include a request URI containing credentials.
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxmox_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
        proxy_buffering off;
    }

    location ^~ /api/proxmox/ {
        # Both access and error logs may otherwise include sensitive API query values.
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    location / {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }
}
